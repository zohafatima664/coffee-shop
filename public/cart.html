<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shopping Cart</title>
<!-- 
<link rel="stylesheet" href="style.css"> -->
<link rel="stylesheet" href="cart.css">
<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>

<body>

<header>

<nav class="navbar section-content">

<a href="index.html" class="navlogo">

<h2 class="logo-text">☕ Coffee</h2>

</a>
<!-- Yeh cart icon aur count badge cart.html mein add karein -->
        <a href="cart.html" class="cart-icon" style="color: white; font-size: 24px; position: relative; text-decoration: none;">
            <i class="bi bi-cart3"></i>
            <span id="cart-count" style="position: absolute; top: -8px; right: -10px; background: #dc3545; color: white; font-size: 12px; padding: 2px 6px; border-radius: 50%;">0</span>
        </a>

</nav>

</header>


<section class="cart-container">

<h2 class="section-title cart-title">My Cart</h2>

<table class="cart-table">

<thead>
<tr>

<th>Product</th>

<th>Price</th>

<th>Quantity</th>

<th>Total</th>

<th>Action</th>

</tr>

</thead>

<tbody id="cart-body">

</tbody>

</table>
<!-- Yahan se change karein -->
<div class="cart-summary">
    <h3 id="grand-total" class="total">
        Grand Total : $0
    </h3>

    <div class="cart-buttons">
        <button id="clear-cart" class="clear-btn">
            Clear Cart
        </button>
        <button id="checkout-btn" class="checkout-btn">
            Checkout
        </button>
    </div>
</div>

</section>

<script src="cart.js"></script>

</body>
</html>
