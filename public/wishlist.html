<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Wishlist - Coffee</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f8f5f2;
            color: #45111b;
        }

        header {
            background: #45111b;
            color: white;
            padding: 25px;
            text-align: center;
        }

        header h1 {
            margin: 0;
        }

        .wishlist-container {
            width: 90%;
            max-width: 1100px;
            margin: 40px auto;
        }

        .wishlist-container h2 {
            text-align: center;
            font-size: 32px;
            margin-bottom: 30px;
        }

        #wishlist-items {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 25px;
        }

        .wishlist-card {
            background: white;
            border-radius: 18px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.12);
        }

        .wishlist-card h3 {
            font-size: 22px;
            margin-bottom: 10px;
        }

        .wishlist-card .price {
            color: #ff9800;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .wishlist-card button {
            border: none;
            padding: 12px 18px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 15px;
            margin: 5px;
        }

        .cart-btn {
            background: #ff9800;
            color: white;
        }

        .remove-btn {
            background: #45111b;
            color: white;
        }

        .empty {
            text-align: center;
            font-size: 20px;
            padding: 50px;
        }

        .back-btn {
            display: block;
            width: fit-content;
            margin: 30px auto;
            padding: 13px 25px;
            background: #45111b;
            color: white;
            text-decoration: none;
            border-radius: 25px;
        }
    </style>

</head>

<body>

    <header>
        <h1>☕ Coffee</h1>
    </header>

    <div class="wishlist-container">

        <h2>❤️ My Wishlist</h2>

        <div id="wishlist-items"></div>

        <a href="index.html" class="back-btn">
            ← Back to Home
        </a>

    </div>


 <script>
    function loadWishlist() {
        const wishlist = JSON.parse(localStorage.getItem("wishlist")) || [];
        const container = document.getElementById("wishlist-items");

        container.innerHTML = "";

        if (wishlist.length === 0) {
            container.innerHTML = `
                <div class="empty">
                    ❤️ Your wishlist is empty
                    <br><br>
                    Add some delicious coffee!
                </div>
            `;
            return;
        }

        wishlist.forEach((product, index) => {
            container.innerHTML += `
                <div class="wishlist-card">
                    <h3>${product.name}</h3>
                    <div class="price">
                        $${Number(product.price).toFixed(2)}
                    </div>
                    <button class="cart-btn" onclick="addToCart('${product.name}', ${product.price})">
                        🛒 Add to Cart
                    </button>
                    <button class="remove-btn" onclick="removeFromWishlist(${index})">
                        ♥ Remove
                    </button>
                </div>
            `;
        });
    }

    function removeFromWishlist(index) {
        let wishlist = JSON.parse(localStorage.getItem("wishlist")) || [];
        wishlist.splice(index, 1);
        localStorage.setItem("wishlist", JSON.stringify(wishlist));
        loadWishlist();
    }

    async function addToCart(name, price) {
        const user = JSON.parse(localStorage.getItem("user"));

        if (!user || !user.id) {
            alert("Please login first.");
            window.location.href = "loginpage.html";
            return;
        }

        try {
            // 🌟 Yahan Vercel link ki jagah relative URL use kiya hai
            const response = await fetch("/cart", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    user_id: user.id,
                    product_name: name,
                    price: Number(price),
                    quantity: 1
                })
            });

            const data = await response.json();

            if (data.success) {
                alert(name + " Added To Cart 🛒");
            } else {
                alert(data.message || "Unable to add product");
            }
        } catch (err) {
            console.log(err);
            alert("Error adding product to cart");
        }
    }

    loadWishlist();
</script>

</body>

</html>
